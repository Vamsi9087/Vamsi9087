<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Courier New',monospace">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="glow" cx=".15" cy=".3" r=".7"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
  <clipPath id="pc"><rect x="620" y="30" width="190" height="240" rx="18"/></clipPath>
  <clipPath id="tc"><rect x="60" y="188" width="0" height="30"><animate attributeName="width" from="0" to="300" dur="2.5s" fill="freeze"/></rect></clipPath>
  <radialGradient id="vig" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117" stop-opacity=".8"/></radialGradient>
  <linearGradient id="leak" x1="0" x2="1"><stop offset="0" stop-color="#ffb347" stop-opacity="0"/><stop offset=".5" stop-color="#ffb347" stop-opacity=".38"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1"><animate attributeName="seed" values="1;2;3;4;5;6;7;8" dur=".8s" repeatCount="indefinite" calcMode="discrete"/></feTurbulence><feColorMatrix type="saturate" values="0"/></filter>
<radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".22"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient></defs>
<style>
  .float{animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .kb{transform-origin:715px 150px;animation:kb 9s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
  .wave{transform-origin:640px 60px;animation:wave 2.5s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(2deg)}}
</style>
<rect x="1" y="1" width="898" height="318" rx="22" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="898" height="318" rx="22" fill="url(#glow)"/>
<ellipse cx="715" cy="150" rx="200" ry="170" fill="url(#amb)"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></ellipse>

<rect x="60" y="34" width="150" height="26" rx="13" fill="#0f2a24" stroke="#1f6f58"/>
<circle cx="76" cy="47" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="88" y="51" font-size="11" fill="#34d399" letter-spacing="2">OPEN TO WORK</text>

<text x="60" y="102" font-size="24" fill="#c9d1d9" font-family="Arial,sans-serif">Hi there, I'm</text>
<text x="60" y="158" font-size="52" font-weight="bold" fill="url(#g)" font-family="Arial,sans-serif">Vamsi Kandula</text>
<rect x="60" y="170" width="90" height="3" rx="2" fill="url(#g)"><animate attributeName="width" values="90;300;90" dur="4s" repeatCount="indefinite"/></rect>

<g clip-path="url(#tc)"><text x="60" y="210" font-size="20" fill="#e6edf3"><tspan fill="#22d3ee">&gt;</tspan> Junior DevOps Engineer</text></g>
<text x="362" y="210" font-size="20" fill="#22d3ee" class="blink">_</text>

<text x="60" y="245" font-size="13" fill="#8b949e" font-family="Arial,sans-serif">Automating cloud infrastructure with Azure, Docker, Kubernetes</text>
<text x="60" y="265" font-size="13" fill="#8b949e" font-family="Arial,sans-serif">and Terraform. CI/CD pipelines, built hands-on.</text>
<text x="60" y="296" font-size="12" fill="#22d3ee">&#9673; Hyderabad, India</text>
<text x="230" y="296" font-size="12" fill="#a78bfa">&#9670; Cloud &amp; DevOps</text>

<!-- photo -->
<g class="float">
  <rect x="620" y="30" width="190" height="240" rx="18" fill="url(#g)" opacity=".25"/>
  <text x="715" y="165" font-size="48" fill="#8b949e" text-anchor="middle" font-family="Arial,sans-serif">VK</text>
  <g clip-path="url(#pc)">
    <g class="kb"><image href="data:image/jpeg;base64,HERO_B64" x="620" y="30" width="190" height="240" preserveAspectRatio="xMidYMin slice"/></g>
    <rect x="620" y="30" width="190" height="240" fill="url(#vig)"/>
    <rect x="620" y="30" width="190" height="240" filter="url(#grain)" opacity=".13"/>
    <rect x="560" y="30" width="60" height="240" fill="url(#leak)"><animate attributeName="x" values="560;810;810" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="620" y="30" width="190" height="240" fill="#ffb347" opacity="0"><animate attributeName="opacity" values="0;.06;0;0;.04;0" dur="3s" repeatCount="indefinite"/></rect>
  </g>
  <text class="wave" x="640" y="60" font-size="26" fill="#fff" font-family="Arial,sans-serif" font-style="italic" font-weight="bold" transform="rotate(-8 640 60)">hiii</text>
</g>
<!-- viewfinder -->
<g stroke="#8b949e" stroke-width="2" fill="none">
  <path d="M600 44V20H624"/><path d="M806 20H830V44"/><path d="M600 262V286H624"/><path d="M806 286H830V262"/>
</g>
<circle cx="610" cy="300" r="4" fill="#ef4444"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
<text x="620" y="304" font-size="11" fill="#c9d1d9" letter-spacing="1">REC</text>
<text x="830" y="304" font-size="10" fill="#8b949e" text-anchor="end">VINTAGE.MP4 · 24FPS</text>
<rect x="600" y="311" width="230" height="3" rx="2" fill="#30363d"/>
<rect x="600" y="311" width="0" height="3" rx="2" fill="url(#g)"><animate attributeName="width" values="0;230" dur="6s" repeatCount="indefinite"/></rect>
</svg>
